<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ultraterm.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070a0d" />
    <meta
      name="description"
      content="UltraTerm unifies durable OMP terminal sessions into one managed desktop command matrix."
    />
    <title>UltraTerm</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body {
        background:
          radial-gradient(ellipse at 11% -12%, rgba(116, 98, 143, 0.13), transparent 34%),
          radial-gradient(ellipse at 96% 8%, rgba(121, 95, 81, 0.055), transparent 31%),
          radial-gradient(ellipse at 52% 120%, rgba(77, 85, 104, 0.07), transparent 42%),
          linear-gradient(150deg, #09090b 0%, #000000 54%, #060608 100%);
        color: #f3f2f5;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      }
      #root { height: 100%; }
      .boot-splash-inline {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .boot-splash-inline__card {
        display: grid;
        justify-items: center;
        gap: 10px;
        padding: 44px 56px;
        border: 1px solid rgba(255, 255, 255, 0.105);
        border-top-color: rgba(255, 255, 255, 0.215);
        border-radius: 24px;
        background: rgba(17, 16, 19, 0.7);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.72), inset 0 1px rgba(255, 255, 255, 0.06);
      }
      .boot-splash-inline__wordmark {
        background: linear-gradient(180deg, #fff 0%, #eee9fb 55%, rgba(214, 209, 223, 0.72) 100%);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        font-size: 30px;
        font-weight: 720;
        letter-spacing: -0.055em;
        line-height: 0.95;
      }
      .boot-splash-inline__byline {
        color: rgba(228, 225, 234, 0.68);
        font-size: 9px;
        font-weight: 660;
        letter-spacing: 0.17em;
        text-transform: uppercase;
      }
      .boot-splash-inline__bar {
        overflow: hidden;
        width: 168px;
        height: 3px;
        margin-top: 10px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.09);
      }
      .boot-splash-inline__bar > span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #cfc3ec, transparent);
        animation: boot-splash-sheen 1.1s ease-in-out infinite;
      }
      .boot-splash-inline__status {
        margin: 6px 0 0;
        color: rgba(228, 225, 234, 0.68);
        font-size: 11px;
      }
      @keyframes boot-splash-sheen {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-inline__bar > span { animation: none; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="boot-splash-inline" role="status" aria-label="Loading UltraTerm">
        <div class="boot-splash-inline__card">
          <strong class="boot-splash-inline__wordmark">UltraTerm</strong>
          <small class="boot-splash-inline__byline">By Implose Labs</small>
          <span class="boot-splash-inline__bar" aria-hidden="true"><span></span></span>
          <p class="boot-splash-inline__status">Restoring your workspace…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
