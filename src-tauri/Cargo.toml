[package]
name = "ultraterm"
version = "0.1.0"
description = "A unified liquid-glass OMP terminal workspace."
authors = ["Liberty Design Studio"]
edition = "2021"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ultraterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = "0.40.1"
portable-pty = "0.9.0"
base64 = "0.22.1"
uuid = { version = "1.24.0", features = ["v4"] }
sysinfo = "0.39.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["net", "io-util", "time", "process", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[dev-dependencies]
tempfile = "3.15.0"
